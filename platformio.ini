; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	greiman/SdFat@^2.2.0
; Puffer/Speicher (Uno hat nur 2 KB RAM, davon braucht setupConfig() ~850 Byte Stack fuer SdFat):
;   XRecvMax  Empfangs-Queue (Zweierpotenz), 8 Byte pro Eintrag
;   XSendMax  Sendepuffer, 9 Byte pro Eintrag
;   SlotMax   Lok-Slots der Bibliothek (Stellpult nutzt keine Loks), 9 Byte pro Slot
;   XNET_RX_IGNORE_LOCO  Lok-/Rueckmelder-Telegramme schon in der ISR verwerfen
; Fuer die Auswertung der Puffer auf der Anlage: -DSHOW_BUFFER_STATS=1 (Anzeige in Zeile 4)
build_flags =
	-DXRecvMax=8
	-DXSendMax=10
	-DSlotMax=1
	-DXNET_RX_IGNORE_LOCO
